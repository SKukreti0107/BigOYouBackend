name: bigoyu

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bigoyu-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket
      - code-execution:/tmp/code-execution          # Named volume for code execution
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CODE_EXECUTION_PATH=/tmp/code-execution
      - CODE_VOLUME_NAME=bigoyu_code-execution
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bigoyu-net
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: rq worker code_queue --url redis://redis:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Mount Docker socket
      - code-execution:/tmp/code-execution          # Named volume for code execution
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CODE_EXECUTION_PATH=/tmp/code-execution
      - CODE_VOLUME_NAME=bigoyu_code-execution
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bigoyu-net
    restart: unless-stopped

networks:
  bigoyu-net:
    driver: bridge

volumes:
  redis-data:
  code-execution:

